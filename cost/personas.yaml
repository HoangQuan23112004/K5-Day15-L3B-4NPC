# DamageCheck — cấu hình CP3 của Lê Viết Khoa, 27/11/2026.
# Nguồn và cách suy ra: cost/README.md. Đây là kịch bản ước tính, chưa phải log dùng thật.
# 1 người dùng = 1 chủ shop; 1 phiên = xử lý 1 yêu cầu khiếu nại hàng vỡ/hỏng.
# 1 yêu cầu = 1 lượt answer(), có thể gọi model nhiều lần nếu hỏi nhiều đơn.
# Chạy khi có .env hợp lệ: python run.py simulate --try (10 phiên, không tính nộp).
sessions: 50
seed: 42

users:
  low: 10
  base: 50
  high: 100
  source: "(tự ước tính) 10/50/100 chủ shop online nhỏ là ba kịch bản triển khai thử, không phải số shop đã đăng ký hoặc quy mô toàn thị trường. Chưa có nguồn công khai xác nhận số shop sẽ dùng DamageCheck."

# Tỉ lệ persona và số đơn/tháng: tự ước tính; share cộng bằng 1.
# Tần suất = đơn/tháng × 0.0038 × 1 phiên/ca.
# 0.0038 là A5 làm tròn trong evidence/summary.md (Vĩnh, 27/11/2026):
# (205 / 18566) × (21 / 61) ≈ 0.0038.
# Giả định mỗi đánh giá ≈ một đơn, mọi ca vỡ đều dùng sản phẩm, 1 lượt/ca.
# Không làm tròn lên số nguyên: số thập phân là kỳ vọng phiên/người/tháng.
personas:
  - name: shop_it_don
    share: 0.5
    uses_per_month: 0.38
    turns_per_session: 1
    types: [thuong, kho]
    source: "evidence/summary.md mục 2, A5 ≈0,38%; xem 27/11/2026. (tự ước tính) 100 đơn/shop/tháng, share 50%, 100% ca vỡ dùng DamageCheck và 1 phiên/ca → 100 × 0.0038 = 0.38 phiên/tháng."
  - name: shop_vua_don
    share: 0.3
    uses_per_month: 1.14
    turns_per_session: 1
    types: [thuong, kho]
    source: "evidence/summary.md mục 2, A5 ≈0,38%; xem 27/11/2026. (tự ước tính) 300 đơn/shop/tháng, share 30%, 100% ca vỡ dùng DamageCheck và 1 phiên/ca → 300 × 0.0038 = 1.14 phiên/tháng."
  - name: shop_nhieu_don
    share: 0.2
    uses_per_month: 3.04
    turns_per_session: 1
    types: [thuong, kho]
    source: "evidence/summary.md mục 2, A5 ≈0,38%; xem 27/11/2026. (tự ước tính) 800 đơn/shop/tháng, share 20%, 100% ca vỡ dùng DamageCheck và 1 phiên/ca → 800 × 0.0038 = 3.04 phiên/tháng."

# USD / 1 triệu token, Standard/Paid Tier, input văn bản, output gồm thinking.
# Đã đối chiếu further-reading/model-prices.md của repo đề ngày 27/11/2026.
